<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gerador de Senhas</title>
</head>

<body>
    <div class="Gerar">
        <h1>Gerador de Senhas</h1>

        <div class="caracteres" <label for="tamanho">Tamanho da senha:</label>
            <input type="number" id="tamanho" min="4" max="30" value="12">
            <label>
                <input type="checkbox" id="maiusculas" checked>
                Letras maiúsculas
            </label>
            <label>
                <input type="checkbox" id="minusculas" checked>
                Letras minúsculas
            </label>
            <label>
                <input type="checkbox" id="numeros" checked>
                Números
            </label>
            <label>
                <input type="checkbox" id="simbolos" checked>
                Símbolos
            </label>
        </div>
        <input type="text" id="senha" placeholder="Sua senha aparecerá aqui" readonly>
        <button onclick="gerarSenha()">Gerar Senha</button>
        <button onclick="copiarSenha()">Copiar Senha</button>
        <button onclick="limparSenha()">Limpar</button>

        <p id="mensagem"></p>
    </div>

    <script>
        function copiarSenha() {
            const senha = document.getElementById("senha").value;

            const mensagem = document.getElementById("mensagem");

            if (senha === "") {
                mensagem.textContent = "Gere uma senha primeiro!";

                setTimeout(() => {
                    mensagem.textContent = "";
                }, 2000);

                return;
            }

            navigator.clipboard.writeText(senha);

            mensagem.textContent = "Senha copiada!";

            setTimeout(() => {
                mensagem.textContent = "";
            }, 2000);

        }
        function gerarSenha() {
            let caracteres = "";

            const maiusculasMarcado =
                document.getElementById("maiusculas").checked;

            if (maiusculasMarcado) {
                caracteres += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            }

            const minusculasMarcado = document.getElementById("minusculas").checked;

            if (minusculasMarcado) {
                caracteres += "abcdefghijklmnopqrstuvwxyz";
            }

            const numerosMarcado = document.getElementById("numeros").checked;

            if (numerosMarcado) {
                caracteres +=
                    "0123456789";
            }


            const simbolosMarcado = document.getElementById("simbolos").checked;

            if (simbolosMarcado) {
                caracteres += "!@#$%^&*()-+";
            }




            const tamanho = document.getElementById("tamanho").value;


            const mensagem = document.getElementById("mensagem");


            if (caracteres === "") {
                document.getElementById("mensagem").textContent = "Selecione pelo menos uma opção!";

                setTimeout(() => {
                    mensagem.textContent = "";
                }, 2000);

                return;
            }


            let senha = "";



            for (let i = 0; i < tamanho; i++) {
                senha += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            document.getElementById("senha").value = senha;

        }
        function limparSenha() {
            document.getElementById("senha").value = "";
            document.getElementById("mensagem").textContent = "";
        }


    </script>



</body>

</html>
